# Reglas de alerta: se ven en Prometheus > Alerts. Útiles como evidencia de monitoreo activo.
groups:
  - name: parcial-api
    rules:
      - alert: ApiCaida
        expr: up{job="parcial-api"} == 0
        for: 30s
        labels:
          severidad: critica
        annotations:
          resumen: "La API no responde a Prometheus"

      - alert: TasaErrores5xxAlta
        expr: sum(rate(http_server_requests_seconds_count{application="parcial-api",status=~"5.."}[1m])) > 0.1
        for: 1m
        labels:
          severidad: alta
        annotations:
          resumen: "Más de 0.1 errores 5xx por segundo"

      - alert: LatenciaP95Alta
        expr: histogram_quantile(0.95, sum by (le) (rate(http_server_requests_seconds_bucket{application="parcial-api"}[1m]))) > 0.5
        for: 1m
        labels:
          severidad: media
        annotations:
          resumen: "El p95 de latencia supera 500 ms"
