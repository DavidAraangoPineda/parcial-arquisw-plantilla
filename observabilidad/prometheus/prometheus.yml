global:
  scrape_interval: 5s
  evaluation_interval: 5s

rule_files:
  - /etc/prometheus/alertas.yml

scrape_configs:
  # Métricas de la API (Spring Boot Actuator + Micrometer)
  - job_name: parcial-api
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["api:8080"]
        labels:
          servicio: parcial-api

  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
