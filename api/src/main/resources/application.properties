spring.application.name=parcial-api
server.port=8080

# ---------- Base de datos (se sobreescribe con variables de entorno en Docker) ----------
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/parcial}
spring.datasource.username=${DB_USER:parcial}
spring.datasource.password=${DB_PASSWORD:parcial}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# ---------- Respuestas ----------
spring.jackson.default-property-inclusion=non_null
spring.mvc.problemdetails.enabled=true

# ---------- Observabilidad ----------
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.show-details=always
management.endpoint.health.probes.enabled=true
management.metrics.tags.application=${spring.application.name}
# Histograma para poder calcular percentiles (p95, p99) en Grafana
management.metrics.distribution.percentiles-histogram.http.server.requests=true
management.info.env.enabled=true
info.app.nombre=${spring.application.name}
info.app.version=@project.version@
info.app.versiones-api=v1,v2

# URL de Loki (solo se usa con el perfil docker, ver logback-spring.xml)
loki.url=${LOKI_URL:http://localhost:3100/loki/api/v1/push}

# ---------- OpenAPI ----------
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs
